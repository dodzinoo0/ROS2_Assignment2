# Bridge simulation clock from Gazebo to ROS 2
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Bridge simulated joint states from Gazebo back to ROS 2 so RViz2 mirrors Gazebo
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Bridge joint position commands from ROS 2 to Gazebo JointPositionController plugins
- ros_topic_name: "/arm_gz/joint1/cmd_pos"
  gz_topic_name: "/arm_gz/joint1/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm_gz/joint2/cmd_pos"
  gz_topic_name: "/arm_gz/joint2/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm_gz/joint3/cmd_pos"
  gz_topic_name: "/arm_gz/joint3/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm_gz/joint4/cmd_pos"
  gz_topic_name: "/arm_gz/joint4/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
